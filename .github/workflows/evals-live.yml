name: AI Evaluations (Live & Regression)

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: 'Number of repetitions (to measure stochastic spread)'
        required: false
        default: '3'
      record:
        description: 'Record fresh baseline and fixtures (true/false)'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # Run every Sunday at 02:00 UTC to catch silent model drift or provider upgrades
    - cron: '0 2 * * 0'

concurrency:
  group: live-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-evals:
    name: Gemini Live Prompt & Model Evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      ENV: test
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Live Evaluation Suite
        id: run_evals
        run: |
          RECORD_FLAG=""
          if [ "${{ inputs.record }}" = "true" ]; then
            RECORD_FLAG="--record"
          fi
          REPEAT_COUNT="${{ inputs.repeat || 3 }}"

          echo "Running evals with --live --repeat $REPEAT_COUNT $RECORD_FLAG..."
          python -m evals.runner --live --repeat "$REPEAT_COUNT" $RECORD_FLAG | tee eval_output.txt

      - name: Publish Evaluation Summary
        if: always()
        run: |
          echo "## AI Evaluation Live Run Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat eval_output.txt 2>/dev/null || echo "No output captured" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit Baseline Update (if recorded)
        if: inputs.record == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/evals/recorded.json backend/evals/baseline.json
          git commit -m "chore(evals): update golden recorded responses and baseline [skip ci]" || echo "No baseline changes"
          git push

