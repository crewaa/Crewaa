[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Modular Monolith Backend"
requires-python = ">=3.11"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",

  # Database
  "sqlalchemy>=2.0",
  "greenlet",
  "asyncpg",
  "alembic",
  "psycopg2-binary",

  # Auth & Security
  "python-jose[cryptography]",
  "bcrypt==3.2.2",
  "passlib[bcrypt]==1.7.4",
  "pydantic[email]",

  # OAuth
  "httpx",

  # Utilities
  "loguru",

  # Error tracking (inert unless SENTRY_DSN is set)
  "sentry-sdk[fastapi]",
  "python-dateutil",

  # AI Engine
  # Pinned to a major version deliberately. Both of these SDKs are the sole
  # interface to a paid external service, and both have changed their response
  # shapes across majors. `apify-client` 3 turned `actor.call()` from a dict
  # into a `Run` model, which took production Instagram imports down on
  # 2026-09-30 after a Render redeploy silently upgraded it — Apify kept
  # succeeding and charging while our parsing failed. Floating majors on a
  # dependency nobody is watching is how that happens again.
  "google-genai>=2.18,<3",

  # Instagram scraping
  "apify-client>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "aiosqlite",   # in-memory database for the test suite
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]
